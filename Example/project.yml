name: LayoutInspectorExample
options:
  bundleIdPrefix: dev.layoutinspector
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LayoutInspector:
    path: ..
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1"
targets:
  InspectorDemo:
    type: application
    platform: iOS
    sources: [InspectorDemo]
    dependencies:
      - package: LayoutInspector
        product: LayoutInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Inspector Demo
        PRODUCT_BUNDLE_IDENTIFIER: dev.layoutinspector.example
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  InspectorBenchmark:
    type: application
    platform: iOS
    sources:
      - path: InspectorBenchmark
        excludes: ["Results/**", "*.sh", "*.py"]
    dependencies:
      - package: LayoutInspector
        product: LayoutInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Inspector Benchmark
        PRODUCT_BUNDLE_IDENTIFIER: dev.layoutinspector.benchmark
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1,2"
        # Runs on devices: pick your team in Xcode or pass DEVELOPMENT_TEAM=… to xcodebuild.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
  InspectorSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InspectorSnapshotTests
        excludes: ["__Snapshots__/**", "Fixtures/**"]
    dependencies:
      - target: InspectorDemo
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/InspectorDemo.app/InspectorDemo
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  InspectorDemo:
    build:
      targets:
        InspectorDemo: all
        InspectorSnapshotTests: [test]
    test:
      targets: [InspectorSnapshotTests]
    run:
      config: Debug
  InspectorBenchmark:
    build:
      targets:
        InspectorBenchmark: all
    run:
      config: Release
